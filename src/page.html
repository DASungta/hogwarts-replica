<style>
/* Layout: the render fills the window; a caption top-left, a lens-style control strip along the bottom, and the
   survey plan as a drawer on the right (a bottom sheet on phones). One dark look on purpose: it frames a photograph. */
:root {
  --night: #0c0f14;
  --veil: rgba(11, 14, 20, 0.66);
  --ink: #efe8da;
  --dim: #a9a294;
  --candle: #d9a95b;
  --slate: #7d8da3;
  --todo: #5d6168;
  --rule: rgba(239, 232, 218, 0.15);
  --plan-bg: #12161d;
  --water: #1a2a36;
  --f-latin: "IM Fell English SC", "Cormorant SC", "Times New Roman", serif;
  --f-han: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-ui: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }
.cap {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 3px; padding: 11px 15px 12px; max-width: calc(100vw - 32px);
  background: var(--veil); border: 1px solid var(--rule); border-radius: 2px; backdrop-filter: blur(6px);
}
.cap .latin { font-family: var(--f-latin); font-size: 23px; letter-spacing: 0.22em; color: var(--candle); }
.cap .han { font-family: var(--f-han); font-weight: 500; font-size: 13px; letter-spacing: 0.1em; }
.cap .meta { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.bar {
  position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none;
}
.bar > * { pointer-events: auto; }
.bar button, .plan-head button {
  font: inherit; font-size: 12.5px; letter-spacing: 0.06em; color: var(--ink); cursor: pointer;
  background: var(--veil); border: 1px solid var(--rule); border-radius: 2px; padding: 7px 12px; backdrop-filter: blur(6px);
}
.bar button:hover, .plan-head button:hover { border-color: var(--dim); }
.bar button[aria-pressed="true"] { border-color: var(--candle); color: var(--candle); }
button:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }
.bar .shot { display: flex; align-items: center; gap: 8px; font-size: 12.5px; letter-spacing: 0.06em; color: var(--dim);
  background: var(--veil); border: 1px solid var(--rule); border-radius: 2px; padding: 3px 4px 3px 12px; backdrop-filter: blur(6px); }
.bar select { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 0; padding: 4px 6px; cursor: pointer; }
.bar select option, .bar select optgroup { color: #111; background: #eee; }
.bar select:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }
.bar .sep { width: 1px; height: 22px; background: var(--rule); margin: 0 4px; }
.bar .hint { font-size: 11.5px; color: var(--dim); background: var(--veil); padding: 6px 10px; border-radius: 2px; }
#loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--night); z-index: 5; }
#loading .latin { font-family: var(--f-latin); font-size: 32px; letter-spacing: 0.3em; color: var(--candle); padding-left: 0.3em; }
#loading .track { width: min(320px, 70vw); height: 2px; background: var(--rule); }
#loading .fill { height: 100%; width: 0; background: var(--candle); transition: width 0.25s; }
#loading .msg { font-size: 12.5px; color: var(--dim); letter-spacing: 0.08em; }
/* survey plan drawer */
.plan {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100vw - 32px));
  display: grid; grid-template-rows: auto auto 1fr; background: rgba(14, 17, 23, 0.93); border: 1px solid var(--rule);
  border-radius: 2px; backdrop-filter: blur(8px); overflow: hidden;
}
.plan-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 14px 8px; }
.plan-head h2 { margin: 0; font-family: var(--f-han); font-weight: 700; font-size: 15px; letter-spacing: 0.12em; }
.plan-head .sub { font-size: 11px; color: var(--dim); letter-spacing: 0.04em; }
.plan-head button { padding: 4px 9px; font-size: 12px; }
.plan svg { display: block; width: 100%; height: auto; background: var(--plan-bg); border-block: 1px solid var(--rule); }
.legend { overflow-y: auto; padding: 8px 6px 12px; display: grid; gap: 1px; align-content: start; }
.legend .grp { font-size: 11px; color: var(--dim); letter-spacing: 0.12em; padding: 10px 8px 4px; }
.legend button {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: baseline; text-align: left;
  font: inherit; color: var(--ink); background: none; border: 0; border-radius: 2px; padding: 6px 8px; cursor: pointer;
}
.legend button:hover, .legend button.on { background: rgba(239, 232, 218, 0.07); }
.legend .no { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; text-align: right; }
.legend .nm { min-width: 0; font-family: var(--f-han); font-size: 13.5px; }
.legend .nm small { display: block; font-family: var(--f-ui); font-size: 11px; color: var(--dim); letter-spacing: 0.02em; }
.chip { font-size: 10.5px; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 2px; border: 1px solid; white-space: nowrap; }
.chip.built { color: var(--candle); border-color: rgba(217, 169, 91, 0.55); }
.chip.mass { color: var(--slate); border-color: rgba(125, 141, 163, 0.55); }
.chip.todo { color: var(--todo); border-color: rgba(93, 97, 104, 0.6); }
.legend .q { color: var(--dim); font-size: 11px; }
[hidden] { display: none !important; }
body.bare .cap, body.bare .bar .opt, body.bare .plan { display: none; }
/* the tour: a play button, a scrubber, captions over the picture */
.bar #tour[aria-pressed="true"] { border-color: var(--candle); color: var(--candle); }
.bar .tourline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums;
  background: var(--veil); border: 1px solid var(--rule); border-radius: 2px; padding: 5px 10px; backdrop-filter: blur(6px); }
.bar .tourline input { width: min(320px, 40vw); accent-color: var(--candle); }
body.touring .cap, body.touring .bar .opt:not(#tour), body.touring .plan, body.touring .bar .hint { display: none; }
#tourcap { position: fixed; left: 6vw; bottom: calc(14vh + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; pointer-events: none;
  font-family: var(--f-han); font-weight: 500; font-size: clamp(16px, 3.4vh, 34px); color: var(--ink); text-shadow: 0 0 12px rgba(0,0,0,0.65); opacity: 0; }
#tourcap::before { content: ""; width: 1.6em; height: 2px; background: var(--candle); }
#tourtitle { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 1.2vh; pointer-events: none; opacity: 0; text-shadow: 0 0 14px rgba(0,0,0,0.6); }
#tourtitle .latin { font-family: var(--f-latin); font-size: clamp(36px, 10vh, 110px); color: #e9cf98; letter-spacing: 0.04em; }
#tourtitle .han { font-family: var(--f-han); font-weight: 500; font-size: clamp(14px, 3.4vh, 34px); color: var(--ink); }
#tourtitle .by { font-family: var(--f-han); font-weight: 500; font-size: clamp(11px, 2.2vh, 22px); color: var(--ink); opacity: 0.78; margin-top: 7vh; }
#tourtitle .src { font-family: var(--f-han); font-weight: 500; font-size: clamp(9px, 1.6vh, 16px); color: var(--ink); opacity: 0.55; }
@media (max-width: 640px) {
  .bar .hint { display: none; }
  .cap .latin { font-size: 19px; }
  .plan { top: auto; bottom: calc(108px + env(safe-area-inset-bottom, 0px)); height: 56vh; width: auto; left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { #loading .fill { transition: none; } }
</style>
